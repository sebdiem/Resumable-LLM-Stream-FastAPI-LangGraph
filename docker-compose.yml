services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
      POSTGRES_DB: chat
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URI: postgres://chat:chat@db:5432/chat
    depends_on:
      db:
        condition: service_healthy
    command: ["procrastinate", "--app=src.tasks.queue.app", "schema", "--apply"]
    restart: "no"

  app:
    build: .
    ports:
      - "8100:8000"
    env_file:
      - .env
    environment:
      DATABASE_URI: postgres://chat:chat@db:5432/chat
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URI: postgres://chat:chat@db:5432/chat
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["procrastinate", "--app=src.tasks.queue.app", "worker"]

volumes:
  postgres_data:
  redis_data:
